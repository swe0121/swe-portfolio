<style>
*{box-sizing:border-box}:root{--black:#030201;--red:#8f2f1b;--orange:#e26032;--gold:#d79748;--sand:#d6a17c;--white:#f1e8e2;--muted:#9c8175}html,body{width:100%;height:100%;margin:0}body{overflow:hidden;background:var(--black);color:var(--white);font-family:"Courier New",monospace;image-rendering:pixelated;overscroll-behavior:none}canvas{display:block;width:100vw;height:100vh;cursor:crosshair;touch-action:none}.back{position:fixed;top:max(18px,env(safe-area-inset-top));left:max(20px,env(safe-area-inset-left));z-index:8;color:var(--sand);text-decoration:none;font-size:11px;letter-spacing:1.3px;transition:.15s}.back:hover{color:var(--orange);transform:translateX(-3px)}.hud{position:fixed;top:max(18px,env(safe-area-inset-top));right:max(22px,env(safe-area-inset-right));z-index:8;text-align:right;color:var(--muted);font-size:11px;line-height:1.65;letter-spacing:1px;pointer-events:none}.hud b{color:var(--orange);font-size:16px;font-weight:normal}.boss-hud{position:fixed;top:max(18px,env(safe-area-inset-top));left:50%;z-index:8;width:min(360px,42vw);transform:translateX(-50%);text-align:center;opacity:0;transition:.2s;pointer-events:none}.boss-hud.show{opacity:1}.boss-name{margin-bottom:6px;pointer-events:auto;cursor:pointer;color:var(--sand);font-size:10px;letter-spacing:1.5px}.boss-bar{height:4px;background:rgba(255,255,255,.08)}.boss-fill{width:100%;height:100%;background:var(--orange);box-shadow:0 0 10px rgba(226,96,50,.4);transition:width .08s}.tip{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom));z-index:7;transform:translateX(-50%);width:min(780px,90%);text-align:center;color:var(--muted);font-size:10px;letter-spacing:1px;line-height:1.7;pointer-events:none}.tip strong{color:var(--sand);font-weight:normal}.start{position:fixed;inset:0;z-index:6;display:grid;place-items:center;text-align:center;pointer-events:none}.start div{transform:translateY(-8vh)}.start strong{display:block;pointer-events:auto;cursor:pointer;color:var(--sand);font-size:clamp(2 .boss-hud.shield .boss-bar{box-shadow:0 0 0 1px var(--gold),0 0 14px rgba(215,151,72,.35)}.control-btn.secret{color:var(--gold)}@keyframes screenShake{0%{transform:translate(0)}25%{transform:translate(-10px,4px) rotate(-.2deg)}50%{transform:translate(8px,-6px) rotate(.2deg)}75%{transform:translate(-4px,-8px)}}@keyframes flash{50%{background:rgba(120,24,7,.62)}}@keyframes tear{to{transform:translate(12px,-8px) rotate(1deg)}}
@media(max-width:700px),(pointer:coarse){body{touch-action:none}canvas{cursor:default}.controls{display:flex}.tip{bottom:calc(max(14px,env(safe-area-inset-bottom)) + 60px);font-size:0}.tip::after{content:"DRAG OR USE THE CONTROLS · BOSSES SHOW UP WHEN THEY FEEL LIKE IT";font-size:8px;color:var(--muted)}.back{left:14px;font-size:10px}.hud{right:14px;font-size:9px}.hud b{font-size:15px}.boss-hud{top:52px;width:min(270px,64vw)}.boss-name{font-size:8px}.start div{width:min(88vw,440px);transform:translateY(-12svh)}.start strong{font-size:clamp(20px,7vw,31px);letter-spacing:2px}.start span{font-size:9px;line-height:1.7}.toast{top:19%;font-size:9px}.crash-text{width:88vw;font-size:clamp(22px,8vw,38px)}.crash-text small{font-size:10px}}
@media(max-width:420px){.controls{gap:16px}.control-btn{width:58px;height:46px}.control-btn.fire{width:70px}.hud{line-height:1.5}.back{font-size:9px}.boss-hud{width:58vw}}

<canvas id="game"></canvas>
<script>
const $=id=>document.getElementById(id),canvas=$('game'),ctx=canvas.getContext('2d'),scoreEl=$('score'),hitsEl=$('hits'),bestEl=$('best'),startEl=$('start'),toastEl=$('toast'),crashEl=$('crash'),bossHud=$('bossHud'),bossName=$('bossName'),bossFill=$('bossFill');
let w=0,h=0,dpr=1,running=false,dead=false,score=0,hits=0,last=0,spawnClock=0,bossLevel=0,nextBossAt=100,boss=null,toastTimer=0,rapidUntil=0,marsTaps=0,shadesUntil=0,typed='',ufoClock=12+Math.random()*18,crateClock=18+Math.random()*20,spreadUntil=0,godUntil=0,titleTaps=0,konami='',tinyUntil=0,partyUntil=0,reverseUntil=0,duckClock=25+Math.random()*30,bossNameTaps=0;
let stars=[],bullets=[],rocks=[],particles=[],ufos=[],crates=[],pops=[],ducks=[];const keys={left:false,right:false},player={x:0,y:0,speed:420,cooldown:0};let best=Number(localStorage.getItem('labBest'))||0;bestEl.textContent=best;
const mobile=()=>matchMedia('(max-width:700px),(pointer:coarse)').matches;
function resize(){dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;canvas.width=w*dpr;canvas.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);player.x=Math.min(Math.max(player.x||w/2,30),w-30);player.y=h*(mobile()?.68:.73);stars=Array.from({length:Math.max(45,Math.floor(w*h/8500))},()=>({x:Math.random()*w,y:Math.random()*h,s:Math.random()*1.6+.4,a:Math.random()*.65+.2}))}addEventListener('resize',resize);resize();
const mars=()=>{const b=Math.min(w,h);return{x:w/2,y:h+b*(mobile()?.19:.22),r:b*(mobile()?.30:.34)}};
function say(text,time=1600){toastEl.textContent=text;toastEl.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toastEl.classList.remove('show'),time)}
function setScore(add){let prev=score;score+=add;scoreEl.textContent=score;if(score>best){best=score;bestEl.textContent=best;localStorage.setItem('labBest',best)}[[69,'nice.'],[123,'123. incredible mathematics.'],[420,'420 points. extremely academic.'],[666,'666. the asteroids are concerned.']].forEach(([n,t])=>score>=n&&prev<n&&say(t,n>400?2100:1500));if(!boss&&score>=nextBossAt)spawnBoss()}
function shoot(){if(dead)return;if(!running){running=true;startEl.classList.add('hide')}if(player.cooldown>0)return;let now=performance.now(),spread=now<spreadUntil,angles=spread?[-110,0,110]:[0];angles.forEach(vx=>bullets.push({x:player.x,y:player.y-18,vx,vy:-720}));player.cooldown=now<godUntil?.035:now<rapidUntil?.065:.16}
function spawnRock(fromBoss=false){const m=mars(),gold=!fromBoss&&Math.random()<.045,x=fromBoss&&boss?boss.x+(Math.random()-.5)*boss.r:20+Math.random()*(w-40),y=fromBoss&&boss?boss.y+boss.r*.45:-45,r=gold?11+Math.random()*4:9+Math.random()*20,targetX=m.x+(Math.random()-.5)*m.r*.9,targetY=m.y-m.r*.88,dx=targetX-x,dy=targetY-y,len=Math.hypot(dx,dy)||1,speed=(fromBoss?120:72)+Math.random()*42+score*.055,base=Math.round(37-r),points=Math.max(7,base+Math.floor(Math.random()*9)-3)*(gold?2:1);rocks.push({x,y,r,vx:dx/len*speed,vy:dy/len*speed,rot:Math.random()*6.28,spin:(Math.random()-.5)*1.7,shade:Math.random(),gold,fromBoss,points})}
function spawnUfo(){const left=Math.random()<.5;ufos.push({x:left?-45:w+45,y:60+Math.random()*h*.32,vx:(left?1:-1)*(90+Math.random()*55),r:16,phase:Math.random()*6.28});ufoClock=18+Math.random()*34}function spawnCrate(){crates.push({x:35+Math.random()*(w-70),y:-25,vy:72+Math.random()*35,r:12,rot:0});crateClock=20+Math.random()*28}function spawnDuck(manual=false){const left=Math.random()<.5;ducks.push({x:left?-45:w+45,y:80+Math.random()*h*.28,vx:(left?1:-1)*(75+Math.random()*30),r:14,phase:Math.random()*6.28});duckClock=35+Math.random()*45;if(manual)say('why is there a duck in space.',1700)}
const bossNames=['THE GROUP PROJECT','DEADLINE.EXE','THE BIG ONE™','UNPAID OVERTIME','DIV WITH TOO MUCH HP','FINAL_BOSS_REAL_FINAL'];
function spawnBoss(){bossLevel++;nextBossAt+=200;const r=Math.min(72+bossLevel*7,mobile()?78:112),maxHp=11+bossLevel*5;boss={x:w/2,y:-r-20,r,hp:maxHp,maxHp,vx:(bossLevel%2?1:-1)*(65+bossLevel*7),targetY:Math.max(95,h*.16),fire:1.6,flash:0,shield:0,move:bossLevel%3,dash:2.6+Math.random()*2,name:bossNames[(bossLevel-1)%bossNames.length]};bossName.textContent=boss.name+' · LV '+bossLevel;bossFill.style.width='100%';bossHud.classList.add('show');say('BOSS INCOMING: '+boss.name,2300)}
function burst(x,y,count=10,color='#e26032',speed=150){for(let i=0;i<count;i++){const a=Math.random()*Math.PI*2,s=30+Math.random()*speed;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.35+Math.random()*.55,max:.9,size:1+Math.random()*3,color})}}
function crashSite(){if(dead)return;dead=true;running=false;document.body.classList.add('dying');crashEl.classList.add('show');burst(w/2,h*.7,120,'#e26032',260);burst(w/2,h*.58,80,'#d79748',220);setTimeout(()=>location.href='index.html?shutdown=1',1350)}
function defeatBoss(){const old=boss;boss=null;bossHud.classList.remove('show');setScore(50+bossLevel*20);burst(old.x,old.y,60,'#e26032',240);burst(old.x,old.y,35,'#d79748',210);const crashChance=Math.min(.22+bossLevel*.045,.48);if(Math.random()<crashChance){say('uh oh.',800);setTimeout(crashSite,650)}else{rapidUntil=performance.now()+6500;if(bossLevel>1)spreadUntil=performance.now()+5000;say('website survived somehow. temporary bad decisions unlocked.',2600)}}
function popScore(x,y,n,c='#d6a17c'){pops.push({x,y,n:'+'+n,life:.75,c})}function hitRock(i,j){const r=rocks[i];burst(r.x,r.y,r.gold?24:13,r.gold?'#d79748':'#e26032',r.gold?210:150);rocks.splice(i,1);bullets.splice(j,1);setScore(r.points);popScore(r.x,r.y,r.points,r.gold?'#d79748':'#d6a17c');if(r.gold)say('rare shiny rock. '+r.points+' points. suspiciously profitable.',1500)}
function hitUfo(i,j){const u=ufos[i];burst(u.x,u.y,28,'#d79748',220);ufos.splice(i,1);bullets.splice(j,1);let n=35+Math.floor(Math.random()*16);setScore(n);popScore(u.x,u.y,n,'#d79748');say('bro was literally just commuting.',1800)}function hitDuck(i,j){let d=ducks[i],n=77;burst(d.x,d.y,30,'#d79748',180);ducks.splice(i,1);bullets.splice(j,1);setScore(n);popScore(d.x,d.y,n,'#f1e8e2');say('you shot the space duck. monster. +77',1900)}function hitCrate(i,j){let c=crates[i];burst(c.x,c.y,25,'#d79748',190);crates.splice(i,1);bullets.splice(j,1);spreadUntil=performance.now()+7000;say('mystery crate: TRIPLE SHOT. totally balanced.',1900)}
function updateBoss(dt){if(!boss)return;let now=performance.now();boss.shield=Math.max(0,boss.shield-dt);boss.flash=Math.max(0,boss.flash-dt);if(boss.y<boss.targetY)boss.y+=80*dt;else{boss.dash-=dt;if(boss.move===1)boss.x+=boss.vx*dt*(1+Math.sin(now/420)*.55);else boss.x+=boss.vx*dt;if(boss.dash<0){if(boss.move===2)boss.vx*=2.2;if(boss.move===0)boss.shield=.9;boss.dash=2.3+Math.random()*2}if(Math.abs(boss.vx)>150)boss.vx*=.985;if(boss.x<boss.r*.85||boss.x>w-boss.r*.85)boss.vx*=-1}bossHud.classList.toggle('shield',boss.shield>0);boss.fire-=dt;if(boss.fire<=0){spawnRock(true);if(bossLevel>1&&Math.random()<.55)spawnRock(true);boss.fire=Math.max(.45,1.5-bossLevel*.09)}for(let j=bullets.length-1;j>=0;j--){let b=bullets[j];if(Math.hypot(boss.x-b.x,boss.y-b.y)<boss.r*.82){bullets.splice(j,1);if(boss.shield>0){burst(b.x,b.y,4,'#d79748',70);continue}boss.hp--;boss.flash=.08;burst(b.x,b.y,5,'#d79748',80);bossFill.style.width=boss.hp/boss.maxHp*100+'%';if(boss.hp<1){defeatBoss();break}}}}
function update(dt){if(dead)return;player.cooldown=Math.max(0,player.cooldown-dt);let rev=performance.now()<reverseUntil;if(keys.left)player.x+=(rev?1:-1)*player.speed*dt;if(keys.right)player.x+=(rev?-1:1)*player.speed*dt;player.x=Math.max(26,Math.min(w-26,player.x));if(!running)return;spawnClock-=dt;ufoClock-=dt;crateClock-=dt;duckClock-=dt;if(ufoClock<=0)spawnUfo();if(crateClock<=0)spawnCrate();if(duckClock<=0){if(Math.random()<.35)spawnDuck();else duckClock=18+Math.random()*25}if(spawnClock<=0){spawnRock();spawnClock=Math.max(boss?.7:.27,(boss?1.05:.7)-score*.0008)}bullets.forEach(b=>{b.x+=(b.vx||0)*dt;b.y+=b.vy*dt});bullets=bullets.filter(b=>b.y>-30);updateBoss(dt);const m=mars();for(let i=rocks.length-1;i>=0;i--){const r=rocks[i];r.x+=r.vx*dt;r.y+=r.vy*dt;r.rot+=r.spin*dt;if(Math.hypot(r.x-m.x,r.y-m.y)<m.r*.92){burst(r.x,r.y,18);rocks.splice(i,1);if(performance.now()<godUntil){say('the cheat code ate that one.',700);continue}hits++;hitsEl.textContent=hits;if(hits===3)say('mars is filing a complaint.',1700);continue}for(let j=bullets.length-1;j>=0;j--){const b=bullets[j];if(Math.hypot(r.x-b.x,r.y-b.y)<r.r+4){hitRock(i,j);break}}}for(let i=crates.length-1;i>=0;i--){let c=crates[i];c.y+=c.vy*dt;c.rot+=dt;if(c.y>h+30){crates.splice(i,1);continue}for(let j=bullets.length-1;j>=0;j--){let b=bullets[j];if(Math.hypot(c.x-b.x,c.y-b.y)<c.r+5){hitCrate(i,j);break}}}for(let i=ufos.length-1;i>=0;i--){const u=ufos[i];u.x+=u.vx*dt;u.phase+=dt*3;if(u.x<-70||u.x>w+70){ufos.splice(i,1);continue}for(let j=bullets.length-1;j>=0;j--){const b=bullets[j];if(Math.hypot(u.x-b.x,u.y-b.y)<u.r+5){hitUfo(i,j);break}}}for(let i=ducks.length-1;i>=0;i--){let d=ducks[i];d.x+=d.vx*dt;d.phase+=dt*4;if(d.x<-70||d.x>w+70){ducks.splice(i,1);continue}for(let j=bullets.length-1;j>=0;j--){let b=bullets[j];if(Math.hypot(d.x-b.x,d.y-b.y)<d.r+6){hitDuck(i,j);break}}}particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.985;p.vy*=.985;p.life-=dt});particles=particles.filter(p=>p.life>0);pops.forEach(p=>{p.y-=28*dt;p.life-=dt});pops=pops.filter(p=>p.life>0)}
function drawStars(){ctx.fillStyle='#030201';ctx.fillRect(0,0,w,h);const g=ctx.createRadialGradient(w*.5,h*.8,0,w*.5,h*.8,h*.75);g.addColorStop(0,'rgba(143,47,27,.15)');g.addColorStop(1,'rgba(3,2,1,0)');ctx.fillStyle=g;ctx.fillRect(0,0,w,h);stars.forEach((s,i)=>{ctx.globalAlpha=s.a;ctx.fillStyle=performance.now()<partyUntil?['#e26032','#d79748','#f1e8e2','#8f2f1b'][i%4]:s.s>1.2?'#d79748':'#f1e8e2';ctx.fillRect(s.x,s.y,s.s,s.s)});ctx.globalAlpha=1}
function drawMars(){const m=mars(),g=ctx.createRadialGradient(m.x-m.r*.34,m.y-m.r*.42,m.r*.08,m.x,m.y,m.r);g.addColorStop(0,'#d95d32');g.addColorStop(.48,'#8f2f1b');g.addColorStop(1,'#3b120a');ctx.fillStyle=g;ctx.beginPath();ctx.arc(m.x,m.y,m.r,0,Math.PI*2);ctx.fill();ctx.globalAlpha=.35;ctx.fillStyle='#321008';for(let i=0;i<9;i++){const a=i*1.9,x=m.x+Math.cos(a)*m.r*.52,y=m.y-m.r*.45+Math.sin(a*1.4)*m.r*.22,rr=m.r*(.035+(i%3)*.018);ctx.beginPath();ctx.arc(x,y,rr,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;if(performance.now()<shadesUntil){ctx.fillStyle='#090503';ctx.fillRect(m.x-m.r*.34,m.y-m.r*.61,m.r*.28,m.r*.08);ctx.fillRect(m.x+m.r*.06,m.y-m.r*.61,m.r*.28,m.r*.08);ctx.fillRect(m.x-m.r*.06,m.y-m.r*.59,m.r*.12,m.r*.025)}}
function drawPlayer(){ctx.save();ctx.translate(player.x,player.y);if(performance.now()<tinyUntil)ctx.scale(.48,.48);ctx.fillStyle=performance.now()<rapidUntil?'#d79748':'#e26032';ctx.beginPath();ctx.moveTo(0,-18);ctx.lineTo(17,14);ctx.lineTo(5,9);ctx.lineTo(0,15);ctx.lineTo(-5,9);ctx.lineTo(-17,14);ctx.closePath();ctx.fill();ctx.fillStyle='#d6a17c';ctx.fillRect(-3,-5,6,9);ctx.fillStyle='#8f2f1b';ctx.fillRect(-5,14,10,7);ctx.restore()}
function drawRock(r){ctx.save();ctx.translate(r.x,r.y);ctx.rotate(r.rot);ctx.fillStyle=r.gold?'#d79748':r.shade>.5?'#715548':'#51413a';ctx.beginPath();for(let i=0;i<8;i++){const a=i/8*Math.PI*2,rr=r.r*(.78+((i*37)%5)/20),x=Math.cos(a)*rr,y=Math.sin(a)*rr;i?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.closePath();ctx.fill();ctx.fillStyle=r.gold?'rgba(90,45,8,.45)':'rgba(30,18,14,.45)';ctx.fillRect(-r.r*.25,-r.r*.2,r.r*.35,r.r*.24);ctx.restore()}
function drawCrate(c){ctx.save();ctx.translate(c.x,c.y);ctx.rotate(c.rot);ctx.fillStyle='#d79748';ctx.fillRect(-10,-10,20,20);ctx.fillStyle='#5a2b10';ctx.fillRect(-2,-10,4,20);ctx.fillRect(-10,-2,20,4);ctx.restore()}function drawDuck(d){ctx.save();ctx.translate(d.x,d.y+Math.sin(d.phase)*4);ctx.scale(d.vx>0?1:-1,1);ctx.fillStyle='#d79748';ctx.fillRect(-9,-6,17,12);ctx.fillRect(4,-11,10,10);ctx.fillStyle='#e26032';ctx.fillRect(13,-7,7,4);ctx.fillStyle='#080301';ctx.fillRect(10,-9,2,2);ctx.restore()}function drawUfo(u){ctx.save();ctx.translate(u.x,u.y+Math.sin(u.phase)*5);ctx.fillStyle='#d6a17c';ctx.fillRect(-15,-3,30,7);ctx.fillStyle='#e26032';ctx.fillRect(-9,-8,18,5);ctx.fillStyle='#8f2f1b';ctx.fillRect(-5,-12,10,4);ctx.fillStyle='#d79748';ctx.fillRect(-18,4,5,3);ctx.fillRect(13,4,5,3);ctx.restore()}
function drawBoss(){if(!boss)return;ctx.save();ctx.translate(boss.x,boss.y);ctx.rotate(Math.sin(performance.now()/800)*.08);ctx.fillStyle=boss.flash?'#f1e8e2':'#6d493b';ctx.beginPath();for(let i=0;i<12;i++){const a=i/12*Math.PI*2,rr=boss.r*(.78+((i*29)%7)/25),x=Math.cos(a)*rr,y=Math.sin(a)*rr;i?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.closePath();ctx.fill();ctx.fillStyle='#2c1510';ctx.beginPath();ctx.arc(-boss.r*.25,-boss.r*.14,boss.r*.15,0,Math.PI*2);ctx.arc(boss.r*.22,boss.r*.18,boss.r*.1,0,Math.PI*2);ctx.fill();ctx.fillStyle='#e26032';ctx.fillRect(-boss.r*.18,-3,boss.r*.36,6);ctx.restore()}
function draw(){drawStars();drawMars();rocks.forEach(drawRock);crates.forEach(drawCrate);ufos.forEach(drawUfo);ducks.forEach(drawDuck);drawBoss();ctx.fillStyle=performance.now()<rapidUntil?'#f1e8e2':'#d79748';bullets.forEach(b=>ctx.fillRect(b.x-1.5,b.y-8,3,12));particles.forEach(p=>{ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,p.size,p.size)});ctx.globalAlpha=1;ctx.font='bold 12px Courier New';ctx.textAlign='center';pops.forEach(p=>{ctx.globalAlpha=Math.min(1,p.life*2);ctx.fillStyle=p.c;ctx.fillText(p.n,p.x,p.y)});ctx.globalAlpha=1;drawPlayer()}
function loop(t){const dt=Math.min((t-last)/1000||0,.033);last=t;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
addEventListener('keydown',e=>{if(e.code==='ArrowLeft'||e.code==='KeyA')keys.left=true;if(e.code==='ArrowRight'||e.code==='KeyD')keys.right=true;if(e.code==='Space'){e.preventDefault();shoot()}let k={ArrowUp:'u',ArrowDown:'d',ArrowLeft:'l',ArrowRight:'r'}[e.key]||e.key.toLowerCase();konami=(konami+k).slice(-10);if(k.length===1)typed=(typed+k).slice(-10);if(typed.endsWith('mars')){shadesUntil=performance.now()+10000;say('okay. mars has shades now.',1700);typed=''}if(typed.endsWith('pew')){spreadUntil=performance.now()+8000;say('PEW MODE. three bullets because one was too reasonable.',1800);typed=''}if(typed.endsWith('boom')){rocks.forEach(r=>burst(r.x,r.y,8));rocks=[];say('you typed boom. apparently that is a weapon.',1800);typed=''}if(typed.endsWith('404')){say('easter egg not found. wait.',1600);setTimeout(()=>say('okay fine, you found it.',1200),900);typed=''}if(typed.endsWith('duck')){spawnDuck(true);typed=''}if(typed.endsWith('tiny')){tinyUntil=performance.now()+10000;say('ship.exe has been compressed.',1500);typed=''}if(typed.endsWith('party')){partyUntil=performance.now()+10000;say('space disco. scientifically necessary.',1600);typed=''}if(typed.endsWith('reverse')){reverseUntil=performance.now()+8000;say('controls reversed. skill issue begins now.',1900);typed=''}if(typed.endsWith('boss')){if(!boss){if(!running){running=true;startEl.classList.add('hide')}spawnBoss()}else say('there is already a large problem on screen.',1600);typed=''}if(konami==='uuddlrlrba'){godUntil=performance.now()+10000;rapidUntil=godUntil;say('konami mode: ten seconds of extremely fair gameplay.',2400);konami=''}});addEventListener('keyup',e=>{if(e.code==='ArrowLeft'||e.code==='KeyA')keys.left=false;if(e.code==='ArrowRight'||e.code==='KeyD')keys.right=false});
bossName.onclick=()=>{if(boss&&++bossNameTaps===5){bossNameTaps=0;boss.name='KEVIN';bossName.textContent='KEVIN · LV '+bossLevel;say('you renamed the boss kevin. happy now?',1800)}};$('startTitle').onclick=()=>{if(++titleTaps===3){titleTaps=0;setScore(20);say('you clicked the title three times. here, take 20 pity points.',2000)}};let dragging=false;canvas.addEventListener('pointerdown',e=>{const m=mars();if(Math.hypot(e.clientX-m.x,e.clientY-m.y)<m.r){marsTaps++;if(marsTaps===5){shadesUntil=performance.now()+10000;say('fine. stop poking mars.',1700)}if(marsTaps===9){godUntil=performance.now()+5000;say('mars has granted five seconds of diplomatic immunity.',1900);marsTaps=0}}dragging=true;player.x=e.clientX;if(e.pointerType!=='touch')shoot();canvas.setPointerCapture?.(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'||dragging)player.x=Math.max(26,Math.min(w-26,e.clientX))});canvas.addEventListener('pointerup',()=>dragging=false);canvas.addEventListener('pointercancel',()=>dragging=false);
const leftBtn=$('leftBtn'),rightBtn=$('rightBtn'),fireBtn=$('fireBtn');const hold=(btn,key)=>{btn.addEventListener('pointerdown',e=>{e.preventDefault();keys[key]=true;if(!running){running=true;startEl.classList.add('hide')}});['pointerup','pointercancel','pointerleave'].forEach(t=>btn.addEventListener(t,()=>keys[key]=false))};hold(leftBtn,'left');hold(rightBtn,'right');fireBtn.addEventListener('pointerdown',e=>{e.preventDefault();shoot()});
</script>
