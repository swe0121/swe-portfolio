<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title></title>
<style>
*{box-sizing:border-box}:root{--black:#030201;--red:#8f2f1b;--orange:#e26032;--gold:#d79748;--sand:#d6a17c;--white:#f1e8e2;--muted:#9c8175}html,body{width:100%;height:100%;margin:0}body{overflow:hidden;background:var(--black);color:var(--white);font-family:"Courier New",monospace;image-rendering:pixelated}canvas{display:block;width:100vw;height:100vh;cursor:crosshair}.back{position:fixed;top:18px;left:20px;z-index:5;color:var(--sand);text-decoration:none;font-size:11px;letter-spacing:1.3px;transition:.15s}.back:hover{color:var(--orange);transform:translateX(-3px)}.hud{position:fixed;top:18px;right:22px;z-index:5;text-align:right;color:var(--muted);font-size:11px;line-height:1.65;letter-spacing:1px;pointer-events:none}.hud b{color:var(--orange);font-size:16px;font-weight:normal}.tip{position:fixed;left:50%;bottom:20px;z-index:5;transform:translateX(-50%);width:min(760px,90%);text-align:center;color:var(--muted);font-size:10px;letter-spacing:1.1px;line-height:1.7;pointer-events:none}.tip strong{color:var(--sand);font-weight:normal}.start{position:fixed;inset:0;z-index:4;display:grid;place-items:center;text-align:center;pointer-events:none}.start div{transform:translateY(-8vh)}.start strong{display:block;color:var(--sand);font-size:clamp(20px,3vw,36px);font-weight:normal;letter-spacing:3px;text-shadow:4px 4px 0 #4a160d}.start span{display:block;margin-top:12px;color:var(--muted);font-size:11px;line-height:1.8;letter-spacing:1px}.start.hide{display:none}.crash{position:fixed;inset:0;z-index:20;display:none;place-items:center;text-align:center;background:rgba(4,0,0,.56);overflow:hidden}.crash::before,.crash::after{content:"";position:absolute;inset:-15%;background:repeating-linear-gradient(71deg,transparent 0 54px,rgba(226,96,50,.4) 55px 58px,transparent 59px 111px);mix-blend-mode:screen;animation:tear .11s steps(2) infinite}.crash::after{transform:rotate(88deg);opacity:.4}.crash.show{display:grid;animation:flash .16s steps(2) 9}.crash-text{position:relative;z-index:2;color:var(--sand);font-size:clamp(22px,4vw,46px);line-height:1.35;letter-spacing:2px;text-shadow:5px 5px 0 #52170b}.crash-text small{display:block;margin-top:14px;color:var(--white);font-size:12px;letter-spacing:1px}body.dying canvas{animation:screenShake .08s steps(2) infinite;filter:saturate(1.8) contrast(1.2)}@keyframes screenShake{0%{transform:translate(0)}25%{transform:translate(-10px,4px) rotate(-.2deg)}50%{transform:translate(8px,-6px) rotate(.2deg)}75%{transform:translate(-4px,-8px)}}@keyframes flash{50%{background:rgba(120,24,7,.62)}}@keyframes tear{to{transform:translate(12px,-8px) rotate(1deg)}}@media(max-width:600px){.back{font-size:10px}.hud{font-size:9px;right:14px}.hud b{font-size:14px}.tip{bottom:12px;font-size:8px}.start span{font-size:9px}}

.controls{position:fixed;z-index:8;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);display:none;align-items:center;justify-content:center;gap:clamp(18px,8vw,46px);width:min(430px,92vw)}
.control-btn{width:64px;height:48px;padding:0;border:0;background:transparent;color:var(--sand);font:700 18px "Courier New",monospace;box-shadow:none;touch-action:none;-webkit-tap-highlight-color:transparent;user-select:none;text-shadow:2px 2px 0 #4a140a}
.control-btn.fire{width:76px;color:var(--orange);background:transparent}.control-btn:active{transform:scale(.92);box-shadow:none;background:transparent;color:var(--gold)}
@media(max-width:700px),(pointer:coarse){
 body{overscroll-behavior:none;touch-action:none}canvas{cursor:default;touch-action:none}.controls{display:flex}.tip{bottom:calc(max(14px,env(safe-area-inset-bottom)) + 60px);font-size:8px;line-height:1.5}.tip strong{display:none}.tip{font-size:0}.tip::after{content:"DRAG THE SHIP OR USE THE CONTROLS · 100 = BAD IDEA";font-size:8px;color:var(--muted)}
 .back{top:max(14px,env(safe-area-inset-top));left:14px;font-size:10px}.hud{top:max(14px,env(safe-area-inset-top));right:14px;font-size:9px}.hud b{font-size:15px}
 .start div{width:min(88vw,440px);transform:translateY(-12svh)}.start strong{font-size:clamp(20px,7vw,31px);letter-spacing:2px}.start span{font-size:9px;line-height:1.7}
 .crash-text{width:88vw;font-size:clamp(22px,8vw,38px)}.crash-text small{font-size:10px}
}
@media(max-width:420px){.controls{gap:16px}.control-btn{width:58px;height:46px}.control-btn.fire{width:70px}.tip::after{font-size:7px}.hud{line-height:1.5}.back{font-size:9px}}
@media(max-height:600px) and (orientation:landscape){.controls{left:auto;right:16px;bottom:12px;transform:none;width:auto;gap:10px}.control-btn{width:50px;height:40px}.control-btn.fire{width:58px}.tip{display:none}.start div{transform:none}.hud{right:14px}}
@media(prefers-reduced-motion:reduce){body.dying canvas{animation:none}.crash::before,.crash::after{animation:none}}
</style>
</head>
<body>
<a class="back" href="index.html">← BACK</a>
<div class="hud">SCORE <b id="score">0</b><br>MARS HITS <span id="hits">0</span></div>
<div class="tip"><strong>MOUSE / A D</strong> TO MOVE · <strong>CLICK / SPACE</strong> TO SHOOT · 100 POINTS = VERY BAD ENGINEERING</div>
<div class="start" id="start"><div><strong>DEFEND THE ROCK</strong><span>shoot the asteroids before they reach mars.<br>click or press space to start.</span></div></div>
<div class="crash" id="crash"><div class="crash-text">100.<br>GREAT. YOU CRASHED THE WEBSITE.<small>redirecting the damage to the main page...</small></div></div>
<div class="controls" aria-label="Touch controls"><button class="control-btn" id="leftBtn" type="button" aria-label="Move left">◀</button><button class="control-btn fire" id="fireBtn" type="button" aria-label="Fire">FIRE</button><button class="control-btn" id="rightBtn" type="button" aria-label="Move right">▶</button></div>
<canvas id="game"></canvas>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),scoreEl=document.getElementById('score'),hitsEl=document.getElementById('hits'),startEl=document.getElementById('start'),crashEl=document.getElementById('crash');let w=0,h=0,dpr=1,running=false,dead=false,score=0,hits=0,last=0,spawnClock=0,stars=[],bullets=[],rocks=[],particles=[];const keys={left:false,right:false},player={x:0,y:0,speed:420,cooldown:0};
function resize(){dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;canvas.width=w*dpr;canvas.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);player.x=Math.min(Math.max(player.x||w/2,30),w-30);player.y=h*(matchMedia('(max-width:700px),(pointer:coarse)').matches?.68:.73);stars=Array.from({length:Math.max(45,Math.floor(w*h/8500))},()=>({x:Math.random()*w,y:Math.random()*h,s:Math.random()*1.6+.4,a:Math.random()*.65+.2}))}addEventListener('resize',resize);resize();
const mars=()=>{const mobile=matchMedia('(max-width:700px),(pointer:coarse)').matches,base=Math.min(w,h);return{x:w/2,y:h+base*(mobile?.19:.22),r:base*(mobile?.30:.34)}};
function shoot(){if(dead)return;if(!running){running=true;startEl.classList.add('hide')}if(player.cooldown>0)return;bullets.push({x:player.x,y:player.y-18,vy:-680});player.cooldown=.16}
function spawnRock(){const m=mars(),x=20+Math.random()*(w-40),y=-45,r=10+Math.random()*17,targetX=m.x+(Math.random()-.5)*m.r*.9,targetY=m.y-m.r*.88,dx=targetX-x,dy=targetY-y,len=Math.hypot(dx,dy)||1,speed=72+Math.random()*42+score*.22;rocks.push({x,y,r,vx:dx/len*speed,vy:dy/len*speed,rot:Math.random()*6.28,spin:(Math.random()-.5)*1.5,shade:Math.random()})}
function burst(x,y,count=10,color='#e26032'){for(let i=0;i<count;i++){const a=Math.random()*Math.PI*2,s=40+Math.random()*150;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.35+Math.random()*.5,max:.85,size:1+Math.random()*3,color})}}
function crashSite(){if(dead)return;dead=true;running=false;document.body.classList.add('dying');crashEl.classList.add('show');burst(w/2,h*.75,90,'#e26032');burst(w/2,h*.65,50,'#d79748');setTimeout(()=>location.href='index.html?crashed=1',2300)}
function hitRock(i,j){const r=rocks[i];burst(r.x,r.y,14,Math.random()>.5?'#e26032':'#d79748');rocks.splice(i,1);bullets.splice(j,1);score+=10;scoreEl.textContent=score;if(score>=100)crashSite()}
function update(dt){if(dead)return;player.cooldown=Math.max(0,player.cooldown-dt);if(keys.left)player.x-=player.speed*dt;if(keys.right)player.x+=player.speed*dt;player.x=Math.max(26,Math.min(w-26,player.x));if(!running)return;spawnClock-=dt;if(spawnClock<=0){spawnRock();spawnClock=Math.max(.28,.72-score*.0025)}bullets.forEach(b=>b.y+=b.vy*dt);bullets=bullets.filter(b=>b.y>-30);const m=mars();for(let i=rocks.length-1;i>=0;i--){const r=rocks[i];r.x+=r.vx*dt;r.y+=r.vy*dt;r.rot+=r.spin*dt;if(Math.hypot(r.x-m.x,r.y-m.y)<m.r*.92){burst(r.x,r.y,18);rocks.splice(i,1);hits++;hitsEl.textContent=hits;continue}for(let j=bullets.length-1;j>=0;j--){const b=bullets[j];if(Math.hypot(r.x-b.x,r.y-b.y)<r.r+4){hitRock(i,j);break}}}particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.985;p.vy*=.985;p.life-=dt});particles=particles.filter(p=>p.life>0)}
function drawStars(){ctx.fillStyle='#030201';ctx.fillRect(0,0,w,h);const g=ctx.createRadialGradient(w*.5,h*.8,0,w*.5,h*.8,h*.75);g.addColorStop(0,'rgba(143,47,27,.15)');g.addColorStop(1,'rgba(3,2,1,0)');ctx.fillStyle=g;ctx.fillRect(0,0,w,h);stars.forEach(s=>{ctx.globalAlpha=s.a;ctx.fillStyle=s.s>1.2?'#d79748':'#f1e8e2';ctx.fillRect(s.x,s.y,s.s,s.s)});ctx.globalAlpha=1}
function drawMars(){const m=mars(),g=ctx.createRadialGradient(m.x-m.r*.34,m.y-m.r*.42,m.r*.08,m.x,m.y,m.r);g.addColorStop(0,'#d95d32');g.addColorStop(.48,'#8f2f1b');g.addColorStop(1,'#3b120a');ctx.fillStyle=g;ctx.beginPath();ctx.arc(m.x,m.y,m.r,0,Math.PI*2);ctx.fill();ctx.globalAlpha=.35;ctx.fillStyle='#321008';for(let i=0;i<9;i++){const a=i*1.9,x=m.x+Math.cos(a)*m.r*.52,y=m.y-m.r*.45+Math.sin(a*1.4)*m.r*.22,rr=m.r*(.035+(i%3)*.018);ctx.beginPath();ctx.arc(x,y,rr,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1}
function drawPlayer(){ctx.save();ctx.translate(player.x,player.y);ctx.fillStyle='#e26032';ctx.beginPath();ctx.moveTo(0,-18);ctx.lineTo(17,14);ctx.lineTo(5,9);ctx.lineTo(0,15);ctx.lineTo(-5,9);ctx.lineTo(-17,14);ctx.closePath();ctx.fill();ctx.fillStyle='#d6a17c';ctx.fillRect(-3,-5,6,9);ctx.fillStyle='#8f2f1b';ctx.fillRect(-5,14,10,7);ctx.restore()}
function drawRock(r){ctx.save();ctx.translate(r.x,r.y);ctx.rotate(r.rot);ctx.fillStyle=r.shade>.5?'#715548':'#51413a';ctx.beginPath();for(let i=0;i<8;i++){const a=i/8*Math.PI*2,rr=r.r*(.78+((i*37)%5)/20),x=Math.cos(a)*rr,y=Math.sin(a)*rr;i?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.closePath();ctx.fill();ctx.fillStyle='rgba(30,18,14,.45)';ctx.fillRect(-r.r*.25,-r.r*.2,r.r*.35,r.r*.24);ctx.restore()}
function draw(){drawStars();drawMars();rocks.forEach(drawRock);ctx.fillStyle='#d79748';bullets.forEach(b=>ctx.fillRect(b.x-1.5,b.y-8,3,12));particles.forEach(p=>{ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,p.size,p.size)});ctx.globalAlpha=1;drawPlayer()}
function loop(t){const dt=Math.min((t-last)/1000||0,.033);last=t;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
addEventListener('keydown',e=>{if(e.code==='ArrowLeft'||e.code==='KeyA')keys.left=true;if(e.code==='ArrowRight'||e.code==='KeyD')keys.right=true;if(e.code==='Space'){e.preventDefault();shoot()}});addEventListener('keyup',e=>{if(e.code==='ArrowLeft'||e.code==='KeyA')keys.left=false;if(e.code==='ArrowRight'||e.code==='KeyD')keys.right=false});let dragging=false;
canvas.addEventListener('pointerdown',e=>{dragging=true;player.x=e.clientX;if(e.pointerType!=='touch')shoot();canvas.setPointerCapture?.(e.pointerId)});
canvas.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'||dragging)player.x=Math.max(26,Math.min(w-26,e.clientX))});
canvas.addEventListener('pointerup',()=>dragging=false);canvas.addEventListener('pointercancel',()=>dragging=false);
const leftBtn=document.getElementById('leftBtn'),rightBtn=document.getElementById('rightBtn'),fireBtn=document.getElementById('fireBtn');
const hold=(btn,key)=>{btn.addEventListener('pointerdown',e=>{e.preventDefault();keys[key]=true;if(!running){running=true;startEl.classList.add('hide')}});['pointerup','pointercancel','pointerleave'].forEach(t=>btn.addEventListener(t,()=>keys[key]=false))};
hold(leftBtn,'left');hold(rightBtn,'right');fireBtn.addEventListener('pointerdown',e=>{e.preventDefault();shoot()});
</script>
</body>
